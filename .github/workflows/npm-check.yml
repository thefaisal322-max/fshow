name: npm check
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['.github/workflows/npm-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm view @supabase/supabase-js time --json | tail -6
          npm view @supabase/supabase-js@latest version dependencies
          npm view @supabase/auth-js time --json | tail -5
