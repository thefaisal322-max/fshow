name: Make signing key (once)

# Creates Faisal Show's own APK signing key ONE time, locked with the ANDROID_KEY_PASS secret,
# and saves only the locked file (android-signing/fshow.p12.enc) in the repo.
# ⚠️ Keep ANDROID_KEY_PASS safe forever: without it the app can never be updated again.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    env:
      PASS: ${{ secrets.ANDROID_KEY_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make the key
        run: |
          if [ ${#PASS} -lt 16 ]; then echo "::error::ANDROID_KEY_PASS must be at least 16 characters"; exit 1; fi
          if [ -f android-signing/fshow.p12.enc ]; then echo "::notice::the key already exists — nothing to do"; exit 0; fi
          keytool -genkeypair -storetype PKCS12 -keystore fshow.p12 -alias fshow -keyalg RSA -keysize 4096 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Faisal Show, O=Faisal Networks, C=AF"
          mkdir -p android-signing
          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt -in fshow.p12 -out android-signing/fshow.p12.enc -pass env:PASS
          echo "::notice title=SHA-256::$(keytool -list -v -keystore fshow.p12 -storepass "$PASS" | grep 'SHA256:' | head -1)"
          rm -f fshow.p12
          git config user.name "fshow-bot"
          git config user.email "fshow-bot@users.noreply.github.com"
          git add android-signing/fshow.p12.enc
          git commit -m "Add the locked APK signing key"
          git push
