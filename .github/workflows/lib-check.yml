name: lib check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm pack react-native-webrtc@124.0.6 >/dev/null 2>&1 && tar xzf react-native-webrtc-124.0.6.tgz
          cd package
          echo "== manifest"; cat android/src/main/AndroidManifest.xml
          echo "== service files"; ls android/src/main/java/com/oney/WebRTCModule/ | grep -i -E "projection|service|screen"
          echo "== getDisplayMedia"; grep -n -A30 "void getDisplayMedia" android/src/main/java/com/oney/WebRTCModule/GetUserMediaImpl.java | head -60
          echo "== onActivityResult"; grep -n -B2 -A25 "onActivityResult" android/src/main/java/com/oney/WebRTCModule/GetUserMediaImpl.java | head -60
          echo "== launch"; grep -rn "MediaProjectionService" android/src | head
          npm pack @config-plugins/react-native-webrtc@13.0.0 >/dev/null 2>&1 && mkdir cp && tar xzf config-plugins-react-native-webrtc-13.0.0.tgz -C cp && grep -rn "FOREGROUND\|Projection\|permission" cp/package/build/*.js | head -20
