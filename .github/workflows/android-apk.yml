name: Android APK

# Builds an installable APK on every push to main.
# Download it from: Actions → latest "Android APK" run → Artifacts → fshow-apk

on:
  push:
    branches: [main]
    paths-ignore: ['supabase/**', '**.md', 'docs/**', '.github/workflows/backend.yml', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch: {}

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_GIT_STATUS: '1'
      EXPO_NO_TELEMETRY: '1'
      # Optional overrides: Settings → Secrets and variables → Actions → Variables
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Android SDK is preinstalled on ubuntu-latest runners (ANDROID_HOME is set).

      - name: Install
        run: |
          npm install
          npx expo install --fix

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: fshow-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
