name: Deploy Supabase

# Pushes database migrations + Edge Functions + the Resend key to your Supabase project.
# Runs by itself when database/function files change on main (or manually: Actions → "Deploy Supabase" → Run workflow).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens → Generate
#   (project ref jqkyihnvidbehrapfflt is built in; override with variable SUPABASE_PROJECT_REF)
#   SUPABASE_DB_PASSWORD   the database password you chose when creating the project
#   RESEND_API_KEY         resend.com → API Keys

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Database migrations
        run: supabase db push --linked --include-all --yes

      - name: Resend key
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: supabase secrets set "RESEND_API_KEY=$RESEND_API_KEY" --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --yes

      - name: Edge Functions
        run: supabase functions deploy --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --yes
