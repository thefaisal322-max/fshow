# Runs the whole backend on one Linux server:
#   db     PostgreSQL 16 (data kept in a volume)
#   api    Faisal Show API (Node.js)
#   caddy  HTTPS (free automatic certificate) → api
#
# Usage on the server:
#   cp .env.example .env   # fill it in
#   docker compose up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fshow
      POSTGRES_USER: fshow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fshow -d fshow"]
      interval: 5s
      retries: 10

  api:
    build: ../server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://fshow:${POSTGRES_PASSWORD}@db:5432/fshow
      PUBLIC_URL: https://${API_DOMAIN:?set API_DOMAIN in .env}
      RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY in .env}
      EMAIL_FROM: ${EMAIL_FROM:-Faisal Show <no-reply@fainet.org>}
      TRUST_PROXY: "true"
    volumes:
      - media:/data/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

volumes:
  pgdata:
  media:
  caddy_data:
