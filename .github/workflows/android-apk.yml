name: Android APK

# Builds an installable APK on every push to main.
# Download it from: Actions → latest "Android APK" run → Artifacts → fshow-apk

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functions:
    name: Check server code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_GIT_STATUS: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Install
        run: |
          npm install
          npx expo install --fix

      - name: Typecheck (warning only)
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - uses: actions/upload-artifact@v4
        with:
          name: fshow-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
