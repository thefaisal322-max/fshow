name: Deploy Supabase

# Pushes database migrations + Edge Functions + the Resend key to your Supabase project.
# Runs by itself when database/function files change on main (or manually: Actions → "Deploy Supabase" → Run workflow).
#
# Repository secrets needed (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  supabase.com → Account → Access Tokens → Generate
#   (project ref jqkyihnvidbehrapfflt is built in; override with variable SUPABASE_PROJECT_REF)
#   SUPABASE_DB_PASSWORD   the database password you chose when creating the project
#   RESEND_API_KEY         resend.com → API Keys

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase.yml'

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Database migrations
        run: supabase db push --linked --include-all --yes

      - name: Resend key
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: supabase secrets set "RESEND_API_KEY=$RESEND_API_KEY" --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --yes

      - name: Call (TURN) keys
        env:
          CF_TURN_KEY_ID: ${{ secrets.CF_TURN_KEY_ID }}
          CF_TURN_API_TOKEN: ${{ secrets.CF_TURN_API_TOKEN }}
        run: |
          if [ -n "$CF_TURN_KEY_ID" ] && [ -n "$CF_TURN_API_TOKEN" ]; then
            supabase secrets set "CF_TURN_KEY_ID=$CF_TURN_KEY_ID" "CF_TURN_API_TOKEN=$CF_TURN_API_TOKEN" --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --yes
          else
            echo "::warning title=Calls::add CF_TURN_KEY_ID and CF_TURN_API_TOKEN (Cloudflare Realtime → TURN) so calls connect on every network"
          fi

      - name: Live (SFU) keys
        env:
          CF_SFU_APP_ID: ${{ secrets.CF_SFU_APP_ID }}
          CF_SFU_APP_TOKEN: ${{ secrets.CF_SFU_APP_TOKEN }}
        run: |
          if [ -n "$CF_SFU_APP_ID" ] && [ -n "$CF_SFU_APP_TOKEN" ]; then
            supabase secrets set "CF_SFU_APP_ID=$CF_SFU_APP_ID" "CF_SFU_APP_TOKEN=$CF_SFU_APP_TOKEN" --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --yes
          else
            echo "::warning title=Live::add CF_SFU_APP_ID and CF_SFU_APP_TOKEN (Cloudflare → Realtime → SFU) for live video"
          fi

      - name: Push (Firebase) keys
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FCM_SERVICE_ACCOUNT" ]; then
            # the hook secret is derived from the Firebase key, so it never has to be typed in anywhere
            HOOK=$(printf '%s fshow-push-hook' "$FCM_SERVICE_ACCOUNT" | sha256sum | cut -c1-48)
            echo "::add-mask::$HOOK"
            echo "PUSH_HOOK_SECRET=$HOOK" >> "$GITHUB_ENV"
            printf '%s' "$FCM_SERVICE_ACCOUNT" > fcm.json
            supabase secrets set "PUSH_HOOK_SECRET=$HOOK" --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --yes
            supabase secrets set "FCM_SERVICE_ACCOUNT=$(jq -c . fcm.json)" --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --yes
            rm -f fcm.json
          else
            echo "::warning title=Push::add FCM_SERVICE_ACCOUNT (Firebase → Project settings → Service accounts) for notifications when the app is closed"
          fi

      - name: Edge Functions
        run: supabase functions deploy --project-ref "${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}" --yes

      - name: Connect database → push function
        if: env.PUSH_HOOK_SECRET != ''
        run: |
          sleep 10
          code=$(curl -s -o out.json -w '%{http_code}' -X POST "https://${{ vars.SUPABASE_PROJECT_REF || 'jqkyihnvidbehrapfflt' }}.supabase.co/functions/v1/push" \
            -H "Content-Type: application/json" -H "x-hook-secret: $PUSH_HOOK_SECRET" -d '{"kind":"setup"}')
          echo "push setup → HTTP $code $(jq -c '{ok, setup, error}' out.json 2>/dev/null)"
          jq -e '.setup == true' out.json >/dev/null || echo "::warning title=Push::setup did not finish (check the FCM_SERVICE_ACCOUNT secret)"
