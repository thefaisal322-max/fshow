name: Android APK

# Builds an installable APK on every push to main.
# Direct download: https://github.com/thefaisal322-max/fshow/releases/latest/download/fshow.apk

on:
  push:
    branches: [main]
    paths-ignore: ['supabase/**', '**.md', 'docs/**', '.github/workflows/backend.yml', '.github/workflows/deploy-supabase.yml',
                   '.github/workflows/ios-ipa.yml', '.github/workflows/optimize-videos.yml']
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      EXPO_NO_GIT_STATUS: '1'
      EXPO_NO_TELEMETRY: '1'
      # Optional overrides: Settings → Secrets and variables → Actions → Variables
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_KEY: ${{ vars.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Android SDK is preinstalled on ubuntu-latest runners (ANDROID_HOME is set).

      - name: Install
        run: |
          npm install
          npx expo install --fix

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # Smaller APK: R8 removes unused Java/Kotlin code, unused resources are dropped,
      # and each phone type gets its own APK instead of one APK with both CPU types.
      - name: Enable code + resource shrinking
        run: |
          {
            echo 'android.enableProguardInReleaseBuilds=true'
            echo 'android.enableMinifyInReleaseBuilds=true'
            echo 'android.enableShrinkResourcesInReleaseBuilds=true'
          } >> android/gradle.properties

      - name: Build APK (64-bit phones — almost all phones)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk ../fshow.apk

      - name: Build APK (old 32-bit phones)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk ../fshow-32bit.apk
          ls -la ../fshow*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: fshow-apk
          path: fshow*.apk
          retention-days: 14

      # Direct download link (no login): https://github.com/<owner>/fshow/releases/latest/download/fshow.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" fshow.apk fshow-32bit.apk \
            --title "Faisal Show build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}" --latest
